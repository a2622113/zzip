name: Update Residential Subscriptions

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Cache runtime
        uses: actions/cache@v4
        with:
          path: runtime
          key: runtime-${{ runner.os }}-v1

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Residential Prober
        run: |
          python main_residential.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A residential.txt
          if git diff --staged --quiet; then
            echo "家宽订阅无变化, 跳过提交。"
          else
            git commit -m "Auto Update Residential: $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
            git push
          fi
